<style>
  :root{
    --desk:#E7E2D7;--paper:#FBFAF6;--ink:#1C1B18;--muted:#5A564D;--rule:#CFC8B9;--edge:#8F887A;--red:#B3261E;--mark:#FBE16B;
    --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--desk)}
  body{margin:0;color:var(--ink);font:400 18px/1.6 var(--serif)}
  ::selection{background:var(--mark);color:var(--ink)}
  a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  a:hover{color:var(--red);text-decoration-thickness:2px}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  code{font-family:var(--mono);font-size:.86em;background:#F0EDE5;padding:1px var(--s1)}
  .sheet{max-width:880px;margin:var(--s7) auto;background:var(--paper);border:1px solid var(--edge);padding:var(--s7) var(--s8) var(--s6)}
  .form{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 var(--s7);border:1px solid var(--ink)}
  .form div{padding:var(--s2) var(--s3);border-left:1px solid var(--ink)}
  .form div:first-child{border-left:0}
  .form dt{font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .form dd{margin:var(--s1) 0 0;font:500 14px/1.3 var(--mono)}
  .form .hot dd{color:var(--red);font-weight:700}
  h1{font:700 clamp(36px,6.4vw,56px)/1.05 var(--serif);letter-spacing:-.015em;margin:0 0 var(--s5)}
  h2{font:700 13px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:var(--s6) 0 var(--s2)}
  p{margin:0 0 var(--s4);max-width:62ch}
  ul.plain{margin:0 0 var(--s4);padding-left:var(--s5);max-width:62ch}
  ul.plain li{margin:0 0 var(--s2)}
  footer{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s7);padding-top:var(--s5);border-top:2px solid var(--ink);font:14px/1.4 var(--mono);color:var(--muted)}
  footer a{color:var(--ink)}
  @media (max-width:640px){
    body{font-size:17px}
    .sheet{margin:0;border:0;padding:var(--s5) var(--s4)}
    .form{grid-template-columns:1fr}
    .form div{border-left:0;border-top:1px solid var(--ink)}
    .form div:first-child{border-top:0}
  }
</style>
</head>
<body>
<div class="sheet">
  <dl class="form">

    <div><dt>Site</dt><dd>polish-website</dd></div>

  </dl>
  <main>

  </main>
  <footer>

</div>
</body>
</html>
